<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mediterranean Fishing Adventure</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="g"></canvas>
<div id="tl" class="gl"></div><div id="tr" class="gl"></div>
<canvas id="mm" width="170" height="170" class="gl"></canvas>
<div id="bl" class="gl"><b>W</b> forward · <b>S</b> reverse · <b>A/D</b> turn<br>Left-click water to sail · Wheel zoom<br><b>Right-click</b> (or Space) = throw bait / tap to reel<br><small>Touch: long-press = throw bait</small></div>

<div id="br"><button data-act="open" data-a="shop">🪱 SHOP</button><button data-act="open" data-a="book">📖 FISH BOOK</button><button data-act="open" data-a="aq">🐠 AQUARIUM</button><button data-act="open" data-a="inv">🎒 INVENTORY</button><button data-act="open" data-a="set">⚙</button></div>
<div id="ban"></div><div id="toast"></div><div id="C" hidden></div><div id="P" hidden></div>
<script src="data.js"></script><script src="game.js"></script></body></html>
